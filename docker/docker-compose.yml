name: vllm

x-vllm-base: &vllm-base
  entrypoint: []
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface/hub}:/root/.cache/huggingface/hub"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped

services:
  nemotron-lightning:
    <<: *vllm-base
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-nemotron-lightning
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command:
      - vllm
      - serve
      - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      - --served-model-name
      - nemotron-3.5-lightning
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.3"
      - --enforce-eager

  gpt-oss:
    <<: *vllm-base
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-gpt-oss
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8=1
    command:
      - vllm
      - serve
      - openai/gpt-oss-120b
      - --served-model-name
      - gpt-oss-120b
      - --tensor-parallel-size
      - "1"
      - --quantization
      - mxfp4
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.5"
      - --enforce-eager

  litellm-db:
    image: postgres:16
    container_name: litellm-db
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-router
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      - UI_USERNAME=${LITELLM_UI_USERNAME}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD}
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped
  
volumes:
  litellm-db-data: